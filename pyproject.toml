[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personal-shopping-agent"
version = "0.1.0"
description = "Evidence-driven, local-first personal shopping decision agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "GreenBrown-one" }]
dependencies = [
  "alembic>=1.16,<2",
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0.41,<3",
]

[project.scripts]
personal-shopping-agent-mcp = "personal_shopping_agent.mcp.server:main"

[dependency-groups]
dev = [
  "mcp[cli]>=2,<3",
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_shopping_agent"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["personal_shopping_agent"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
