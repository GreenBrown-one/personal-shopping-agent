[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personal-shopping-agent"
dynamic = ["version"]
description = "Evidence-driven, local-first personal shopping decision agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "GreenBrown-one" }]
dependencies = [
  "alembic>=1.16,<2",
  "jinja2>=3.1.6,<4",
  "mcp>=2,<3",
  "openai>=2.53,<3",
  "playwright>=1.61,<2",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0.41,<3",
]

[project.scripts]
personal-shopping-agent = "personal_shopping_agent.interfaces.cli:main"
personal-shopping-agent-mcp = "personal_shopping_agent.interfaces.mcp.server:main"
personal-shopping-agent-mcp-jd = "personal_shopping_agent.interfaces.mcp.server:main_jd"

[dependency-groups]
dev = [
  "coverage-conditional-plugin>=0.9,<1",
  "mcp[cli]>=2,<3",
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.version]
path = "src/personal_shopping_agent/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_shopping_agent"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "personal_shopping_agent/migrations"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
plugins = ["coverage_conditional_plugin"]
source = ["personal_shopping_agent"]

[tool.coverage.coverage_conditional_plugin.rules]
# POSIX permission enforcement is unreachable elsewhere (DESIGN.md 8.1); Linux CI still covers it.
"#\\s*pragma:\\s*posix-only" = "os_name != 'posix'"

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
